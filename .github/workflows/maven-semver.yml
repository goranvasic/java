name: Maven SemVer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maven-semver

      - name: Build maven-semver
        working-directory: maven-semver
        run: mvn --batch-mode --no-transfer-progress --show-version verify
