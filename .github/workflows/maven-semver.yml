name: Maven SemVer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Maven 4
        shell: bash
        env:
          MAVEN_VERSION: 4.0.0-rc-7
          MAVEN_SHA512: 17b886c0ffb7ec225e514afa8179b3143d855d196cfbb4607ece6272a9b4f51501a389438ab6841b393a4b1391a1b714f07f450daba1951f53f732b400338184
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/${archive##*/}" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build maven-semver
        working-directory: maven-semver
        run: mvn --batch-mode --no-transfer-progress --show-version verify
