name: Maven SemVer Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          LC_ALL: C
        run: |
          number='(0|[1-9][0-9]*)'
          prerelease_id="($number|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
          build_id='[0-9a-zA-Z-]+'
          semver="^v$number\.$number\.$number(-$prerelease_id(\.$prerelease_id)*)?(\+$build_id(\.$build_id)*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maven-semver

      - name: Build release JAR
        working-directory: maven-semver
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: mvn --batch-mode --no-transfer-progress --show-version "-Drevision=$RELEASE_VERSION" verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        working-directory: maven-semver
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Docker tags disallow '+' and are limited to 128 characters.
          image_tag="${RELEASE_VERSION//+/_}"
          if (( ${#image_tag} > 128 )); then
            version_hash=$(printf '%s' "$RELEASE_VERSION" | sha256sum)
            image_tag="sha256-${version_hash%% *}"
          fi
          image="ghcr.io/goranvasic/maven-semver:$image_tag"
          docker build \
            --build-arg "JAR_FILE=target/maven-semver-$RELEASE_VERSION.jar" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --tag "$image" \
            .
          docker push "$image"
          printf 'reference=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --notes "Container image \`$IMAGE_REFERENCE\`."
