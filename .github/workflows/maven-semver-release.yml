name: Maven SemVer Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          LC_ALL: C
        run: |
          number='(0|[1-9][0-9]*)'
          prerelease_id="($number|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
          build_id='[0-9a-zA-Z-]+'
          semver="^v$number\.$number\.$number(-$prerelease_id(\.$prerelease_id)*)?(\+$build_id(\.$build_id)*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maven-semver

      - name: Build release JAR
        working-directory: maven-semver
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: mvn --batch-mode --no-transfer-progress --show-version "-Drevision=$RELEASE_VERSION" verify

      - name: Build Docker image
        working-directory: maven-semver
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Docker tags disallow '+' and are limited to 128 characters.
          image_tag="${RELEASE_VERSION//+/_}"
          if (( ${#image_tag} > 128 )); then
            image_tag="$GITHUB_SHA"
          fi
          docker build \
            --build-arg "JAR_FILE=target/maven-semver-$RELEASE_VERSION.jar" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --tag "maven-semver:$image_tag" \
            .

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jar="maven-semver/target/maven-semver-$RELEASE_VERSION.jar"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$jar" "${args[@]}"
